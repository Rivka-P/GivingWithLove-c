name: CI/CD Docker Pipeline

# אירועים שמפעילים את ה-Workflow
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build & Test Application
    runs-on: ubuntu-latest
    steps:
      # שלב 1: Checkout הקוד
      - name: Checkout code
        uses: actions/checkout@v4

      # שלב 2: התקנת Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # שלב 3: התקנת Dependencies
      - name: Install dependencies
        run: npm ci

      # שלב 4: הרצת בדיקות יחידה
      - name: Run Tests
        run: npm test

  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test # תלוי שהבדיקות עברו קודם
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # הגדרת Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # התחברות ל-Docker Hub באמצעות Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # בניית תמונת Docker ופריסה ל-Docker Hub
      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: your-dockerhub-username/your-app:latest